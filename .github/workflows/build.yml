name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Verify assets are present
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          for f in pk64560 ptyrun kp_arm.sh ksu_load_setup.sh; do
            unzip -l "$APK" | grep -q "assets/$f" || { echo "missing asset: $f"; exit 1; }
          done
          # ksud / busybox 不应出现在 APK 里（GPL 合规）
          if unzip -l "$APK" | grep -qE 'assets/(ksud|busybox)'; then
            echo "GPL binaries must not be bundled"; exit 1
          fi
          echo "assets OK"
